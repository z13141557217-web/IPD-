server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # 模型调用可能较慢，放宽超时。
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri /index.html;
    }
}
